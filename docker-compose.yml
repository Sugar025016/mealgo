version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: mealgo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: mealgo
      MYSQL_USER: jessie
      MYSQL_PASSWORD: 1qaz!QAZ
      TZ: Asia/Taipei
    ports:
      - "3307:3306"
    volumes:
      - ./db_data:/var/lib/mysql
      - ./mysql/conf:/etc/mysql/conf.d
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci


  redis:
    image: redis:7
    container_name: mealgo_redis
    restart: always
    ports:
      - "6379:6379"    
    command: redis-server --requirepass redis123