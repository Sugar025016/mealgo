spring.application.name=mealgo


# 資料庫設定
# spring.datasource.url=jdbc:mysql://localhost:3306/hero_wars?useSSL=false&serverTimezone=Asia/Taipei
spring.datasource.url=jdbc:mysql://localhost:3307/mealgo?useSSL=false&serverTimezone=Asia/Taipei&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
## 資料庫Driver
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## 資料庫版本
spring.jpa.database-platform = org.hibernate.dialect.MySQL8Dialect
## 開啟執行的sql

spring.jpa.show-sql=true


## 資料庫操作create-drop 刪除後創見、update 存在更新不存在新增
# spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.ddl-auto=create
# spring.jpa.hibernate.ddl-auto=update